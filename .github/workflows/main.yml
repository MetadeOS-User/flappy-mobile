name: Gerar APK (Android)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:  # permite rodar manualmente na aba Actions

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Impede o p4a de pedir confirmação interativa para instalar pacotes.
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  apk:
    name: Compilar APK (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Instalar o Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.6.0"

      # SDK/NDK do Android (vários GB) ficam em cache entre as execuções.
      - name: Cache do SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      # O runner já vem com ~15 GB ocupados por ferramentas que não usamos
      # (o buildozer baixa o próprio SDK/NDK). Liberar evita falta de disco.
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /

      - name: Compilar o APK
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"  # mostra o log em tempo real, sem segurar em buffer
        run: |
          java -version
          python --version
          pip show buildozer | head -n 2
          free -m
          buildozer -v android debug 2>&1 | tee build.log

      - name: Mostrar o final do log (só se falhou)
        if: failure()
        run: |
          echo "===== últimas linhas do build.log ====="
          tail -n 150 build.log || echo "build.log não foi criado"
          df -h /

      - name: Enviar o log completo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Enviar o APK como artefato
        uses: actions/upload-artifact@v7
        with:
          name: flappy-bird-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

  # Ao criar uma tag (ex.: git tag v1.0 && git push --tags), anexa o APK a uma Release.
  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Baixar o APK
        uses: actions/download-artifact@v8
        with:
          name: flappy-bird-apk
          path: apk

      - name: Criar a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" apk/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flappy Bird $GITHUB_REF_NAME" \
            --generate-notes
