name: Gerar APK (Android)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:  # permite rodar manualmente na aba Actions

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Impede o p4a de pedir confirmação interativa para instalar pacotes.
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  apk:
    name: Compilar APK (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      # O build do Android é pesado em disco (NDK, SDK, Python e SDL compilados).
      # Aqui: 1) apagamos ferramentas pré-instaladas que não usamos e
      #       2) movemos os diretórios grandes para o disco secundário (/mnt).
      - name: Preparar disco
        run: |
          echo "===== antes ====="; df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo apt-get clean || true
          if [ -d /mnt ]; then
            sudo mkdir -p /mnt/buildozer-global /mnt/gradle /mnt/logs
            sudo chown -R "$(id -u):$(id -g)" /mnt/buildozer-global /mnt/gradle /mnt/logs
            # SDK + NDK + downloads do buildozer
            ln -sfn /mnt/buildozer-global "$HOME/.buildozer"
            echo "GRADLE_USER_HOME=/mnt/gradle" >> "$GITHUB_ENV"
            echo "BUILD_LOG=/mnt/logs/build.log" >> "$GITHUB_ENV"
          else
            echo "BUILD_LOG=$RUNNER_TEMP/build.log" >> "$GITHUB_ENV"
          fi
          echo "===== depois ====="; df -h / /mnt || true

      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Instalar o Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.6.0"

      - name: Compilar o APK
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"  # mostra o log em tempo real, sem segurar em buffer
        run: |
          java -version
          python --version
          pip show buildozer | head -n 2
          free -m
          # Mostra o uso de disco a cada 3 minutos (ajuda a achar o que enche o disco)
          ( while sleep 180; do echo "[disco] $(date +%T)"; df -h / /mnt | head -n 3; done ) &
          MONITOR=$!
          trap 'pkill -P $MONITOR 2>/dev/null || true; kill $MONITOR 2>/dev/null || true' EXIT
          buildozer -v android debug 2>&1 | tee "$BUILD_LOG"

      - name: Mostrar o final do log (só se falhou)
        if: failure()
        run: |
          echo "===== últimas linhas do log ====="
          tail -n 150 "$BUILD_LOG" || echo "o log não foi criado"
          echo "===== disco ====="; df -h / /mnt || true

      - name: Enviar o log completo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: ${{ env.BUILD_LOG }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Enviar o APK como artefato
        uses: actions/upload-artifact@v7
        with:
          name: flappy-bird-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

  # Ao criar uma tag (ex.: git tag v1.0 && git push --tags), anexa o APK a uma Release.
  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Baixar o APK
        uses: actions/download-artifact@v8
        with:
          name: flappy-bird-apk
          path: apk

      - name: Criar a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" apk/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flappy Bird $GITHUB_REF_NAME" \
            --generate-notes
